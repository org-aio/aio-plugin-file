[package]
name = "aio-plugin-file-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
aio-plugin-file-model = { path = "../model" }
az-plugin-process = { git = "https://github.com/org-aio/aio-platform.git", rev = "0008ce8bc79593627fa9df07616acd7533c546f4" }
futures-util = "0.3.31"
libc = "0.2.177"
urlencoding = "2.1.3"
serde_json = "1.0.145"
tokio-util = "0.7.16"
anyhow = "1.0.99"
async-trait = "0.1.89"
axum = "0.8.6"
dill = "0.15.0"
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["postgres", "runtime-tokio-rustls"] }
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["fs", "io-util", "sync", "macros", "rt-multi-thread", "time"] }
uuid = { version = "1.18.1", features = ["v4"] }

[dev-dependencies]
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls"] }

tempfile = "3.21.0"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
