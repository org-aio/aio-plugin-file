name: Files
on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.1-alpine3.23
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aio_file_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AIO_FILE_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/aio_file_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: nightly-2026-05-25
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
      - run: cargo fmt --all --check
      - run: cargo clippy --locked -p aio-plugin-file-server --all-targets -- -D warnings
      - run: psql "$AIO_FILE_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'REVOKE ALL ON SCHEMA public FROM PUBLIC'
      - run: cargo test --locked -p aio-plugin-file-server -- --include-ignored --test-threads=1
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: nightly-2026-05-25
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - run: cargo clippy --locked -p aio-plugin-file-client --target wasm32-unknown-unknown -- -D warnings
      - run: |
          curl -fsSL https://github.com/DioxusLabs/dioxus/releases/download/v0.7.9/dx-x86_64-unknown-linux-gnu.tar.gz -o /tmp/dx.tar.gz
          echo '3b132551b480bc96f938f9f0d37936ee1190f994977539dcc347eaf38540d005  /tmp/dx.tar.gz' | sha256sum -c -
          sudo tar -xzf /tmp/dx.tar.gz -C /usr/local/bin
      - run: dx build --package aio-plugin-file-client --web --release --inject-loading-scripts false --debug-symbols false
      - run: node scripts/package-frontend.mjs target/dx/aio-plugin-file-client/release/web/public
