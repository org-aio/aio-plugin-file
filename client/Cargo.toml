[package]
name = "aio-plugin-file-client"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
aio-plugin-file-model = { path = "../model" }
az-dioxus-admin-shell = { git = "https://github.com/zjarlin/dioxus-admin-workbench.git", rev = "1bb367d499d119f4de88a2ed2e7b3acfcc088e6f" }
az-ui-components = { git = "https://github.com/zjarlin/dioxus-admin-workbench.git", rev = "1bb367d499d119f4de88a2ed2e7b3acfcc088e6f" }
dill = "0.15.0"
dioxus = { version = "=0.7.9", default-features = false, features = ["macro", "html", "signals"] }
dioxus-icons = { version = "0.1.0", default-features = false }
gloo-net = { version = "0.6.0", features = ["http", "json"] }
js-sys = "0.3.77"
serde = "1.0.228"
serde_json = "1.0.145"
web-sys = { version = "0.3.77", features = ["Location", "Window"] }

[lints]
workspace = true
